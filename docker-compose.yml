# =============================================================================
# LoyalMindApp — KoboToolbox stack override layer.
#
# Usage: ./scripts/kobo-start.sh   (applies .env, then `docker compose up -d`)
#    or: docker compose up -d     (once .env is already applied)
#
# Docker Compose reads `.env` in this directory automatically, and `.env` sets
# COMPOSE_FILE to chain kobo-docker's frontend + backend compose files
# together with THIS file as the final layer - so `docker compose` commands
# run from here always see the full, merged stack with no extra `-f` flags.
#
# kobo-install normally runs backend/frontend as two SEPARATE projects
# (`kobobe`/`kobofe`). Chaining all 4 kobo-docker files plus this one under a
# single COMPOSE_PROJECT_NAME (set in .env) folds them into ONE project, so
# `docker compose up -d` / `down` / `ps` control the whole thing at once.
#
# This file's job is purely to patch the merged result:
#   - un-externalize `kobo-be-network` now that backend+frontend share a
#     single project (no need for kobo-install's separate-project trick)
#   - pin a handful of amd64-only images so they run under emulation on
#     Apple Silicon. Delete the `platform:` lines when running on the
#     x86_64 Ubuntu server, where native images exist and no emulation
#     is needed.
# =============================================================================

services:
  postgres:
    platform: linux/amd64
  kpi:
    platform: linux/amd64
  worker:
    platform: linux/amd64
  worker_kobocat:
    platform: linux/amd64
  worker_low_priority:
    platform: linux/amd64
  worker_long_running_tasks:
    platform: linux/amd64
  beat:
    platform: linux/amd64
  enketo_express:
    platform: linux/amd64

networks:
  kobo-be-network:
    external: false
    name: ${COMPOSE_PROJECT_NAME}_kobo-be-network
